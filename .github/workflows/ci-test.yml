name: CI test

on:
  push:
    branches:
      - feat/alt-buffer-scroll-simulate
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --flavor full

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: conduit-debug-apk
          path: build/app/outputs/flutter-apk/app-full-debug.apk
          if-no-files-found: error
