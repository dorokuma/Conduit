name: CI test

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The app variant pulls in a Flutter plugin with its own CMakeLists, so the
      # debug APK needs CMake 3.22.1 plus a pinned NDK; the hosted image ships
      # neither at that revision. Mirror what release.yml provisions.
      - name: Install Android SDK packages for the native build
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "${sdkmanager_bin}" --licenses > /dev/null 2>&1 || true
          "${sdkmanager_bin}" \
            "platforms;android-34" "platforms;android-35" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" \
            "cmake;3.22.1"
          ndk_dir="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${ndk_dir}" ]]; then
            "${sdkmanager_bin}" "ndk;28.2.13676358"
            ndk_dir="${ANDROID_HOME}/ndk/28.2.13676358"
          fi
          echo "Using NDK at ${ndk_dir}"
          {
            echo "ANDROID_NDK_HOME=${ndk_dir}"
            echo "ANDROID_NDK_ROOT=${ndk_dir}"
          } >> "${GITHUB_ENV}"

      - name: Build debug APK
        run: flutter build apk --debug --flavor full

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: conduit-debug-apk
          path: build/app/outputs/flutter-apk/app-full-debug.apk
          if-no-files-found: error
