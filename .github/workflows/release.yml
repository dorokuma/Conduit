name: Release

on:
  push:
    branches:
      - feat/alt-buffer-scroll-simulate
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag override (e.g. v1.4.45). Defaults to v<versionName> from pubspec.yaml'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          app_version="${pubspec_version%%+*}"
          version_code="${pubspec_version##*+}"
          if [[ -z "${app_version}" || -z "${version_code}" || "${app_version}" == "${version_code}" ]]; then
            echo "::error::pubspec.yaml version must use Flutter's versionName+versionCode format."
            exit 1
          fi

          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="${INPUT_TAG}"
            if [[ "${tag}" =~ ^v[0-9] ]]; then
              app_version="${tag#v}"
            else
              tag="v${tag}"
            fi
          else
            tag="v${app_version}"
          fi

          {
            echo "tag=${tag}"
            echo "name=Release ${tag}"
            echo "version=${app_version}"
            echo "version_code=${version_code}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check existing release assets
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          target_repo="${GITHUB_REPOSITORY}"
          if gh release view "${TAG}" -R "${target_repo}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists on ${target_repo}. Checking existing assets..."
            existing_assets=$(gh release view "${TAG}" -R "${target_repo}" --json assets --jq '.assets[].name' 2>/dev/null || true)
            for apk in app-armeabi-v7a-release.apk app-arm64-v8a-release.apk app-x86_64-release.apk; do
              if echo "${existing_assets}" | grep -Fxq "${apk}"; then
                echo "::error::Asset '${apk}' already exists in release '${TAG}'. Aborting to prevent overwriting."
                exit 1
              fi
            done
            echo "Release ${TAG} exists, but target APKs are not present. Proceeding with build."
          else
            echo "Release ${TAG} does not exist yet. Proceeding with build."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build local shell native binaries
        run: |
          docker_args=(--rm)
          if [[ -n "${ACT:-}" ]]; then
            act_container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '/act-Release-Test-and-release/ { print $1; exit }')"
            if [[ -z "$act_container" ]]; then
              echo "Could not find the running act job container." >&2
              exit 1
            fi
            docker_args+=(--volumes-from "$act_container" -w "$PWD")
          else
            docker_args+=(-v "$PWD:/workspace" -w /workspace)
          fi
          docker run "${docker_args[@]}" debian:trixie \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends autoconf autogen automake autopoint bison build-essential curl file flex g++ g++-multilib gawk gettext gnupg gperf git intltool jq libfl-dev libglib2.0-dev libltdl-dev libtool-bin lrzip lzip lz4 lzop m4 openjdk-21-jdk-headless patch patchelf pkg-config python-is-python3 python3-pip python3-setuptools python3-venv python-wheel-common rsync scons sudo tar unzip wget xz-utils zip zstd
              git config --global --add safe.directory "$(pwd)"
              git config --global --add safe.directory "$(pwd)/build/local-shell-native/termux-packages"
              CONDUIT_KEEP_LOCAL_SHELL_BUILD_ARTIFACTS=1 TERMUX_JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 TERMUX_QUIET_BUILD=true tools/build-local-shell-binaries.sh
              chown -R '"$(id -u):$(id -g)"' android/app/src/main/jniLibs build/local-shell-native third_party/source-offer/bundled-binaries.sha256 || true
            '
          android_sdk="$PWD/build/local-shell-native/android-sdk-9123335"
          android_ndk="$PWD/build/local-shell-native/android-ndk-r29"
          test -d "$android_sdk"
          test -d "$android_ndk"
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            {
              echo "ANDROID_HOME=$android_sdk"
              echo "ANDROID_SDK_ROOT=$android_sdk"
              echo "ANDROID_NDK_HOME=$android_ndk"
              echo "ANDROID_NDK_ROOT=$android_ndk"
              echo "NDK=$android_ndk"
            } >> "$GITHUB_ENV"
          fi
          if [[ -n "${GITHUB_PATH:-}" ]]; then
            {
              echo "$android_sdk/platform-tools"
              echo "$android_sdk/cmdline-tools/bin"
            } >> "$GITHUB_PATH"
          fi

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            if [[ -n "${ACT:-}" ]]; then
              echo "ANDROID_KEYSTORE_BASE64 is not set; local act run will build unsigned APKs."
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 must be set for signed release APKs."
            exit 1
          fi

          required=(
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_STORE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} must be set when ANDROID_KEYSTORE_BASE64 is set."
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
          } > android/key.properties

      - name: Build Android APKs
        run: flutter build apk --release --flavor full --split-per-abi

      - name: Show local release metadata
        if: ${{ env.ACT }}
        run: |
          echo "Local act run; skipping GitHub tag and release creation."
          echo "Tag would be: ${{ steps.metadata.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
