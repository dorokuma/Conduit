name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require tag to equal pubspec versionName
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          app_version="${pubspec_version%%+*}"
          version_code="${pubspec_version##*+}"
          if [[ -z "${app_version}" || -z "${version_code}" || "${app_version}" == "${version_code}" ]]; then
            echo "::error::pubspec.yaml version must use Flutter versionName+versionCode format (got: '${pubspec_version}')."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          expected="v${app_version}"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "::error::Tag '${tag}' must equal pubspec versionName '${expected}'. Bump pubspec.yaml, then push that tag. No tag override is accepted."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"

      - name: Check release assets before building
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          target_repo="${GITHUB_REPOSITORY}"
          assets=(
            app-armeabi-v7a-release.apk
            app-arm64-v8a-release.apk
            app-x86_64-release.apk
            app-armeabi-v7a-full-release.apk
            app-arm64-v8a-full-release.apk
            app-x86_64-full-release.apk
          )
          if ! gh release view "${TAG}" -R "${target_repo}" >/dev/null 2>&1; then
            echo "Release ${TAG} does not exist yet. This workflow will create it."
            exit 0
          fi
          echo "Release ${TAG} exists. Existing assets will be replaced with --clobber after a successful build."
          existing_assets="$(gh release view "${TAG}" -R "${target_repo}" --json assets --jq '.assets[].name')"
          for apk in "${assets[@]}"; do
            if printf '%s\n' "${existing_assets}" | grep -Fxq "${apk}"; then
              echo "Asset '${apk}' is already attached and will be replaced."
            fi
          done

  release:
    name: Test and release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build local shell native binaries
        run: |
          docker_args=(--rm)
          if [[ -n "${ACT:-}" ]]; then
            act_container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '/act-Release-Test-and-release/ { print $1; exit }')"
            if [[ -z "$act_container" ]]; then
              echo "Could not find the running act job container." >&2
              exit 1
            fi
            docker_args+=(--volumes-from "$act_container" -w "$PWD")
          else
            docker_args+=(-v "$PWD:/workspace" -w /workspace)
          fi
          docker run "${docker_args[@]}" debian:trixie \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends autoconf autogen automake autopoint bison build-essential curl file flex g++ g++-multilib gawk gettext gnupg gperf git intltool jq libfl-dev libglib2.0-dev libltdl-dev libtool-bin lrzip lzip lz4 lzop m4 openjdk-21-jdk-headless patch patchelf pkg-config python-is-python3 python3-pip python3-setuptools python3-venv python-wheel-common rsync scons sudo tar unzip wget xz-utils zip zstd
              git config --global --add safe.directory "$(pwd)"
              git config --global --add safe.directory "$(pwd)/build/local-shell-native/termux-packages"
              CONDUIT_KEEP_LOCAL_SHELL_BUILD_ARTIFACTS=1 TERMUX_JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 TERMUX_QUIET_BUILD=true tools/build-local-shell-binaries.sh
              chown -R '"$(id -u):$(id -g)"' android/app/src/main/jniLibs build/local-shell-native third_party/source-offer/bundled-binaries.sha256 || true
            '
          android_sdk="$PWD/build/local-shell-native/android-sdk-9123335"
          android_ndk="$PWD/build/local-shell-native/android-ndk-r29"
          test -d "$android_sdk"
          test -d "$android_ndk"
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            {
              echo "ANDROID_HOME=$android_sdk"
              echo "ANDROID_SDK_ROOT=$android_sdk"
              echo "ANDROID_NDK_HOME=$android_ndk"
              echo "ANDROID_NDK_ROOT=$android_ndk"
              echo "NDK=$android_ndk"
            } >> "$GITHUB_ENV"
          fi
          if [[ -n "${GITHUB_PATH:-}" ]]; then
            {
              echo "$android_sdk/platform-tools"
              echo "$android_sdk/cmdline-tools/bin"
            } >> "$GITHUB_PATH"
          fi

      - name: Install Android platform required by compileSdk
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            echo "::error::sdkmanager not found at ${sdkmanager_bin}"
            exit 1
          fi
          yes | "${sdkmanager_bin}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager_bin}" --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-34" "platforms;android-35" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" \
            "cmake;3.22.1"
          ls "${ANDROID_SDK_ROOT}/platforms"

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            if [[ -n "${ACT:-}" ]]; then
              echo "ANDROID_KEYSTORE_BASE64 is not set; local act run will build unsigned APKs."
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 must be set for signed release APKs."
            exit 1
          fi

          required=(
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_STORE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} must be set when ANDROID_KEYSTORE_BASE64 is set."
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
          } > android/key.properties

      - name: Build Android APKs
        run: flutter build apk --release --flavor full --split-per-abi

      - name: Locate built APKs
        id: apks
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          abis=(armeabi-v7a arm64-v8a x86_64)
          files=()
          for abi in "${abis[@]}"; do
            legacy="${apk_dir}/app-${abi}-release.apk"
            flavored="${apk_dir}/app-${abi}-full-release.apk"
            if [[ -f "${legacy}" ]]; then
              files+=("${legacy}")
            elif [[ -f "${flavored}" ]]; then
              files+=("${flavored}")
            else
              echo "::error::Missing APK for ${abi}. Looked for $(basename "${legacy}") and $(basename "${flavored}")."
              if [[ -d "${apk_dir}" ]]; then
                find "${apk_dir}" -type f -name '*.apk' -print
              fi
              exit 1
            fi
          done
          # Portable arm64 artifact: same binary as the full-flavor APK, but
          # with the stable conduit-<version>-arm64-release.apk name. Building
          # it here reuses the jniLibs produced above instead of rebuilding in
          # a second workflow.
          portable_source=""
          for candidate in "${apk_dir}/app-arm64-v8a-full-release.apk" "${apk_dir}/app-arm64-v8a-release.apk"; do
            if [[ -f "${candidate}" ]]; then
              portable_source="${candidate}"
              break
            fi
          done
          if [[ -n "${portable_source}" && -n "${APP_VERSION:-}" ]]; then
            portable="${apk_dir}/conduit-${APP_VERSION}-arm64-release.apk"
            cp "${portable_source}" "${portable}"
            files+=("${portable}")
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${files[@]}"

      - name: Show local release metadata
        if: ${{ env.ACT }}
        run: |
          echo "Local act run; skipping GitHub release creation."
          echo "Tag would be: ${{ needs.preflight.outputs.tag }}"

      - name: Publish GitHub release
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          TARGET: ${{ github.sha }}
          APK_FILES: ${{ steps.apks.outputs.files }}
        run: |
          set -euo pipefail
          target_repo="${GITHUB_REPOSITORY}"
          mapfile -t files <<< "${APK_FILES}"
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No APK files to upload."
            exit 1
          fi
          for apk in "${files[@]}"; do
            if [[ -z "${apk}" || ! -f "${apk}" ]]; then
              echo "::error::APK path is missing: '${apk}'"
              exit 1
            fi
          done
          if gh release view "${TAG}" -R "${target_repo}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Replacing attached APKs."
          else
            gh release create "${TAG}" \
              --repo "${target_repo}" \
              --target "${TARGET}" \
              --title "Release ${TAG}" \
              --generate-notes \
              --latest
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber -R "${target_repo}"
